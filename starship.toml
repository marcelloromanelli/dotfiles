# Starship prompt config — https://starship.rs/config/
# Style: Tokyo Night Powerline — solid colored blocks with arrow transitions.
# Requires a Nerd Font (MesloLGS Nerd Font Mono is installed via Brewfile).

# Breathing room between commands
add_newline = true
command_timeout = 1000

# -----------------------------------------------------------------------------
# Format
# -----------------------------------------------------------------------------
# Each block has a solid bg color; the   character between blocks is an arrow
# whose fg matches the previous bg and whose bg matches the next one.
# Conditional blocks (git/lang/aws) include their own leading arrow inside their
# format, so when they're empty the arrow vanishes with them.
# -----------------------------------------------------------------------------
format = """
[](fg:#bb9af7)\
[  ](bg:#bb9af7 fg:#1a1b26)\
[](fg:#bb9af7 bg:#7aa2f7)\
[ $directory ](bg:#7aa2f7 fg:#1a1b26)\
[](fg:#7aa2f7 bg:#9ece6a)\
$git_branch\
$git_status\
$python\
$nodejs\
$aws\
$cmd_duration\
$fill\
$time\
$line_break\
$character"""

# -----------------------------------------------------------------------------
# Prompt character
# -----------------------------------------------------------------------------
[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #9ece6a)"

# -----------------------------------------------------------------------------
# Fill — pushes the time to the right edge
# -----------------------------------------------------------------------------
[fill]
symbol = " "

# -----------------------------------------------------------------------------
# Directory
# -----------------------------------------------------------------------------
[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "$path"
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"

# -----------------------------------------------------------------------------
# Git — branch + status share the same green block.
# git_branch carries the leading arrow from blue→green; if absent (non-git
# folder), the whole green block disappears and the language/aws blocks
# transition from blue directly.
# -----------------------------------------------------------------------------
[git_branch]
symbol = ""
format = '[ $symbol $branch ](bg:#9ece6a fg:#1a1b26)'

[git_status]
format = '[$all_status$ahead_behind ](bg:#9ece6a fg:#1a1b26)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "= "
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
stashed = "\\$${count} "
deleted = "✘${count} "

# -----------------------------------------------------------------------------
# Languages — share the red block. python/nodejs each carry the leading arrow
# (assumes the typical case where git was present right before).
# -----------------------------------------------------------------------------
[python]
symbol = ""
format = '[](fg:#9ece6a bg:#f7768e)[ $symbol $pyenv_prefix${version} ](bg:#f7768e fg:#1a1b26)'
pyenv_version_name = true

[nodejs]
symbol = ""
format = '[](fg:#9ece6a bg:#f7768e)[ $symbol $version ](bg:#f7768e fg:#1a1b26)'
detect_files = ["package.json", ".node-version", ".nvmrc"]

# -----------------------------------------------------------------------------
# AWS — orange block, only shows when AWS_PROFILE is set
# -----------------------------------------------------------------------------
[aws]
symbol = ""
format = '[](fg:#f7768e bg:#ff9e64)[ $symbol $profile ](bg:#ff9e64 fg:#1a1b26)'

[aws.region_aliases]
eu-central-1 = "eu-c1"
us-east-1 = "us-e1"

# -----------------------------------------------------------------------------
# Command duration — only shown when last command took >2s
# -----------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
format = '[](fg:#ff9e64 bg:#1a1b26) [took $duration](#f7768e)'

# -----------------------------------------------------------------------------
# Time — right-aligned via $fill
# -----------------------------------------------------------------------------
[time]
disabled = false
format = '[ $time ](#565f89)'
time_format = "%H:%M"

# -----------------------------------------------------------------------------
# Hide noise
# -----------------------------------------------------------------------------
[package]
disabled = true
